name: Publish Dockers

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-test'

env:
  REGISTRY: ghcr.io

jobs:
  release_version:
    name: Release Project Version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Previous stable tag reachable from this one (ignores -test tags),
          # so notes cover everything since the last real release.
          PREV=$(git describe --tags --abbrev=0 --exclude='*-test' "${TAG}^" 2>/dev/null || true)

          ARGS=(--title "$TAG" --generate-notes --verify-tag)
          [ -n "$PREV" ] && ARGS+=(--notes-start-tag "$PREV")
          [[ "$TAG" == *-test ]] && ARGS+=(--prerelease)

          gh release create "$TAG" "${ARGS[@]}"

  build-and-push-database:
    name: Publish database for devs
    needs: release_version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Select variant
        id: variant
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref_name }}" == *-test ]]; then
            echo "image=${OWNER}/database-test" >> "$GITHUB_OUTPUT"
            echo "fill_dir=1_fill_test" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=${OWNER}/database-dev" >> "$GITHUB_OUTPUT"
            echo "fill_dir=1_fill" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ steps.variant.outputs.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ steps.variant.outputs.latest == 'true' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: true
          build-args: |
            FILL_DIR=${{ steps.variant.outputs.fill_dir }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
