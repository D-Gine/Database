version: "3.8"
services:
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: abel.daverio@epitech.eu
      PGADMIN_DEFAULT_PASSWORD: prout
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - back

volumes:
  pgadmin-data:

networks:
  back:
    external: true
    name: ${BACK_NETWORK}
